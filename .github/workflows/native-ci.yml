name: Native Markdown checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux analysis, tests and desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: bash tool/bootstrap.sh
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Linux debug build
        run: flutter build linux --debug
      - name: Upload Linux development bundle
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-markdown-linux-debug
          path: build/linux/x64/debug/bundle/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: bash tool/bootstrap.sh
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Upload Android development APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-markdown-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
