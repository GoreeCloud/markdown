name: Native Markdown checks

on:
  # Feature branches are checked by pull_request, avoiding duplicate push runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR commits should not consume further build minutes.
concurrency:
  group: goreecloud-markdown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux analysis, tests and desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: bash tool/bootstrap.sh
      - name: Capture dependency evidence
        run: |
          mkdir -p build/evidence
          cp pubspec.lock build/evidence/pubspec.lock
          flutter pub deps --json > build/evidence/flutter-pub-deps.json
          flutter --version > build/evidence/flutter-version.txt
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Linux debug build
        run: flutter build linux --debug
      - name: Hash Linux debug bundle
        run: |
          (cd build/linux/x64/debug/bundle && find . -type f -print0 | sort -z | xargs -0 sha256sum) > build/evidence/linux-bundle.sha256
      - name: Upload Linux build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-markdown-linux-build-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-markdown-linux-debug
          path: build/linux/x64/debug/bundle/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: bash tool/bootstrap.sh
      - name: Capture dependency evidence
        run: |
          mkdir -p build/evidence
          cp pubspec.lock build/evidence/pubspec.lock
          flutter pub deps --json > build/evidence/flutter-pub-deps.json
          flutter --version > build/evidence/flutter-version.txt
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Hash Android debug APK
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/evidence/android-apk.sha256
      - name: Upload Android build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-markdown-android-build-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-markdown-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
